name: Sync v1.8.9.137 release notes

on:
  push:
    branches:
      - ops/v137-release-notes-user-facing-20260919
    paths:
      - '.github/workflows/sync-v137-release-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notes
        uses: actions/checkout@v4

      - name: Update published release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.8.9.137             --repo newnew114514/LimbusLyric             --title "LimbusLyric v1.8.9.137"             --notes-file RELEASE_NOTES_V137.md

      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.8.9.137             --repo newnew114514/LimbusLyric             --json tagName,name,isDraft,isPrerelease,body,url
