name: Diagnose v137 staged payload

on:
  push:
    branches:
      - build/infra11-fast-test-20260919
    paths:
      - '.github/workflows/diagnose-v137-payload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diagnose payload candidates
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, io, itertools, json, lzma, tarfile
          from pathlib import Path

          root=Path.cwd()
          pfiles=sorted((root/'.release_payload/parts').glob('v137_source.part*.b64'))
          parts=[''.join(p.read_text(encoding='ascii').split()) for p in pfiles]
          while len(parts)<3: parts.append('')
          p0,p1,p2=parts[:3]
          p1a,p1b=p1[:16000],p1[16000:]

          def overlap_merge(a,b):
              for k in range(min(len(a),len(b)),0,-1):
                  if a[-k:]==b[:k]:
                      return a+b[k:]
              return a+b

          cands=[]
          seen=set()
          def add(label,s):
              if s and s not in seen:
                  seen.add(s); cands.append((label,s))

          add('raw-all',''.join(parts))
          add('p0+p1',p0+p1)
          add('p0+p2',p0+p2)
          add('p0+p1a+p2',p0+p1a+p2)
          add('p0+p1a+p1b',p0+p1a+p1b)
          segs=[('p1a',p1a),('p1b',p1b),('p2',p2)]
          for r in range(1,4):
              for combo in itertools.permutations(segs,r):
                  seq=[p0]+[x[1] for x in combo]
                  label='p0+'+'+'.join(x[0] for x in combo)
                  add(label,''.join(seq))
                  m=seq[0]
                  for s in seq[1:]: m=overlap_merge(m,s)
                  add(label+'-overlap',m)

          raws=[]
          for label,s in cands:
              try:
                  if '=' in s[:-2]:
                      raise ValueError('internal-padding')
                  raw=base64.b64decode(s + '='*((-len(s))%4), validate=True)
                  raws.append((label+' single',raw))
              except Exception as e:
                  pass

          def dec_piece(s):
              return base64.b64decode(s + '='*((-len(s))%4), validate=False)
          pieces={}
          for name,s in [('p0',p0),('p1',p1),('p2',p2),('p1a',p1a),('p1b',p1b)]:
              try: pieces[name]=dec_piece(s)
              except Exception: pass
          for names in [
              ('p0','p1'),('p0','p2'),('p0','p1a','p2'),('p0','p1a','p1b'),
              ('p0','p1a','p2','p1b'),('p0','p2','p1b'),('p0','p1b','p2')
          ]:
              if all(n in pieces for n in names):
                  raws.append(('+'.join(names)+' pieces',b''.join(pieces[n] for n in names)))

          lines=[]
          lines.append('part_sizes='+json.dumps([len(x) for x in parts]))
          lines.append('part_sha256='+json.dumps([hashlib.sha256(x.encode()).hexdigest() for x in parts]))
          ok=0
          for label,raw in raws:
              try:
                  tar_bytes=lzma.decompress(raw)
                  with tarfile.open(fileobj=io.BytesIO(tar_bytes),mode='r:') as tf:
                      members=[m for m in tf.getmembers() if m.isfile()]
                      lines.append('')
                      lines.append('SUCCESS '+label)
                      lines.append('raw_sha256='+hashlib.sha256(raw).hexdigest())
                      lines.append('tar_size='+str(len(tar_bytes)))
                      lines.append('members='+str(len(members)))
                      for m in members[:80]:
                          f=tf.extractfile(m)
                          b=f.read() if f else b''
                          lines.append(f'{m.name}\t{len(b)}\t{hashlib.sha256(b).hexdigest()}')
                  ok+=1
              except Exception as e:
                  lines.append('FAIL '+label+' :: '+repr(e))
          lines.append('')
          lines.append('success_count='+str(ok))
          Path('.ci/payload-diagnostic.txt').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/payload-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record v137 payload diagnostic [skip ci]"
            git push origin HEAD:build/infra11-fast-test-20260919
          fi
