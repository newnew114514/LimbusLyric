name: Diagnose v137 staged payload

on:
  push:
    branches:
      - build/infra11-fast-test-20260919
    paths:
      - '.github/workflows/diagnose-v137-payload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode partial tar
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path

          root=Path.cwd()
          p=sorted((root/'.release_payload/parts').glob('v137_source.part*.b64'))
          p0,p1,p2=[''.join(x.read_text(encoding='ascii').split()) for x in p[:3]]
          s=p0+p1[:16000]+p2
          raw=base64.b64decode(s + '='*((-len(s))%4), validate=False)
          dec=lzma.LZMADecompressor()
          try:
              out=dec.decompress(raw)
          except lzma.LZMAError as e:
              out=b''
              err=repr(e)
          else:
              err=''
          lines=[
              f'encoded_len={len(s)}',
              f'raw_len={len(raw)}',
              f'decompressed_len={len(out)}',
              f'eof={dec.eof}',
              f'unused={len(dec.unused_data)}',
              f'error={err}',
              '',
              'PARTIAL_TAR_MEMBERS:'
          ]
          # Parse complete POSIX tar headers/data without requiring end-of-archive blocks.
          pos=0
          idx=0
          while pos+512 <= len(out):
              hdr=out[pos:pos+512]
              if hdr == b'\0'*512:
                  break
              name=hdr[0:100].split(b'\0',1)[0].decode('utf-8','replace')
              prefix=hdr[345:500].split(b'\0',1)[0].decode('utf-8','replace')
              if prefix: name=prefix+'/'+name
              size_field=hdr[124:136].rstrip(b'\0 ').strip()
              try: size=int(size_field or b'0',8)
              except Exception:
                  lines.append(f'BAD_HEADER offset={pos} name={name!r} size_field={size_field!r}')
                  break
              typeflag=hdr[156:157]
              data_start=pos+512
              data_end=data_start+size
              complete=data_end <= len(out)
              sha=hashlib.sha256(out[data_start:data_end]).hexdigest() if complete and typeflag in (b'0',b'\0') else '-'
              lines.append(f'{idx}\t{name}\ttype={typeflag!r}\tsize={size}\tcomplete={int(complete)}\tsha256={sha}')
              idx+=1
              pos=data_start+((size+511)//512)*512
              if not complete:
                  break
          lines += ['', f'parsed_members={idx}', f'next_offset={pos}', f'bytes_remaining={max(0,len(out)-pos)}']
          Path('.ci/payload-partial-tar.txt').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines))
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/payload-partial-tar.txt
          if ! git diff --cached --quiet; then
            git commit -m "Inspect partial v137 payload tar [skip ci]"
            git push origin HEAD:build/infra11-fast-test-20260919
          fi
